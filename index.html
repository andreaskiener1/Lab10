<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Menüleiste oben, Arbeitsfläche mit verschiebbaren Fenstern, Ablage für minimierte Fenster unten */
:root {
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #dfe5ea;
  --grid: #cdd5dc;
  --chrome: #ffffff;
  --chrome-2: #eef1f4;
  --ink: #17222c;
  --muted: #566573;
  --line: #b4bfca;
  --accent: #14607d;
  --accent-ink: #ffffff;
  --hover: #e2eaf0;
  --lit: #78dc78;
  --lit-strong: #1f9d3d;
  --warn: #b3261e;
  --shadow: 0 1px 2px rgba(10,20,30,.18), 0 10px 28px rgba(10,20,30,.18);
  /* Schaltplanblatt bleibt in beiden Themes hell */
  --sheet: #ffffff;
  --sheet-ink: #111;
  --sheet-line: #8b96a3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181e; --grid: #19222a; --chrome: #1d2730; --chrome-2: #26323d;
    --ink: #e5ecf2; --muted: #98a8b6; --line: #3a4856; --accent: #2f8fb0; --accent-ink: #04141b;
    --hover: #2b3844; --lit-strong: #54d06f; --warn: #ff8a80;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181e; --grid: #19222a; --chrome: #1d2730; --chrome-2: #26323d;
  --ink: #e5ecf2; --muted: #98a8b6; --line: #3a4856; --accent: #2f8fb0; --accent-ink: #04141b;
  --hover: #2b3844; --lit-strong: #54d06f; --warn: #ff8a80;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.4 var(--font-ui);
  overflow: hidden;
}
#app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Menüs */
.menubar { display: flex; align-items: stretch; gap: 2px; background: var(--chrome); padding: 0 8px; flex: none; }
.menubar.main { border-bottom: 1px solid var(--line); min-height: 34px; }
.menubar.inwin { border-bottom: 1px solid var(--line); background: var(--chrome-2); min-height: 30px; flex-wrap: wrap; }
.menu { position: relative; display: flex; }
.menu > button.top {
  background: none; border: 0; padding: 0 12px; cursor: pointer; border-radius: 4px; margin: 3px 0;
}
.menu > button.top:hover, .menu.open > button.top { background: var(--hover); }
.menu-list {
  position: absolute; top: 100%; left: 0; z-index: 5000; min-width: 220px; padding: 4px;
  background: var(--chrome); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
  display: none; flex-direction: column;
}
.menu.open > .menu-list { display: flex; }
.menu-list button {
  display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0;
  padding: 7px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;
}
.menu-list button:hover, .menu-list button:focus-visible { background: var(--hover); }
.menu-list .accel { margin-left: auto; padding-left: 24px; color: var(--muted); font-size: 12px; }
.swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.4); flex: none; }
.menu-list .sep { height: 1px; background: var(--line); margin: 4px 2px; }

/* Arbeitsfläche */
#desk {
  position: relative; flex: 1; min-height: 0; overflow: hidden;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
#empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center; color: var(--muted); pointer-events: none;
}
#empty[hidden] { display: none; }
#empty p { max-width: 36ch; margin: 0; text-wrap: balance; }
#tray {
  flex: none; display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 8px;
  background: var(--chrome); border-top: 1px solid var(--line);
}
#tray[hidden] { display: none; }
#tray button {
  background: var(--chrome-2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer;
}
#tray button:hover { background: var(--hover); }

/* Fenster */
.win {
  position: absolute; display: flex; flex-direction: column; width: fit-content;
  max-width: 100%; max-height: 100%;
  background: var(--chrome); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
}
.win-bar {
  display: flex; align-items: center; gap: 8px; flex: none; padding: 0 4px 0 12px; height: 32px;
  background: var(--chrome-2); color: var(--muted); border-radius: 5px 5px 0 0;
  cursor: grab; touch-action: none; user-select: none;
}
.win.active .win-bar { background: var(--accent); color: var(--accent-ink); }
.win-bar:active { cursor: grabbing; }
.win-title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-btns { display: flex; gap: 2px; }
.wbtn {
  width: 28px; height: 24px; border: 0; background: none; border-radius: 4px; cursor: pointer;
  font-size: 18px; line-height: 1; display: grid; place-items: center;
}
.wbtn:hover { background: rgba(127,127,127,.28); }
.win-body { flex: 1; min-height: 0; min-width: 0; overflow: auto; background: var(--chrome); }
.win-foot {
  flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px;
  padding: 5px 12px; border-top: 1px solid var(--line); background: var(--chrome-2);
  font-size: 12px; color: var(--muted); border-radius: 0 0 5px 5px;
}
.win-foot .err { color: var(--warn); font-weight: 600; }
.win-foot span { min-width: 0; }
.win-foot { contain: inline-size; } /* Fußzeile umbricht, statt das Fenster zu verbreitern */
.win-foot .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Von-Neumann-Rechner: Blatt in Originalkoordinaten */
.vn-stage { position: relative; width: 730px; height: 680px; background: var(--sheet); color: var(--sheet-ink); }
.vn-stage > * { position: absolute; }
.vn-bg { left: 4px; top: 0; width: 721px; height: 677px; max-width: none; user-select: none; pointer-events: none; }
.vn-f {
  border: 1px solid var(--sheet-line); background: #fff; color: var(--sheet-ink); border-radius: 0;
  font: 500 14px var(--font-mono); padding: 0 8px; box-sizing: border-box; transition: background-color .12s;
}
.vn-f.lit { background: var(--lit); }
.vn-adr {
  display: grid; place-items: center; font: 500 13px var(--font-mono); color: #4b5663; box-sizing: border-box;
  border: 1px solid #c9d0d8; background: #f1f3f5;
}
.vn-lab { font: 12px/1.2 var(--font-ui); color: var(--sheet-ink); display: flex; align-items: center; }
.vn-arrow {
  display: flex; align-items: center; justify-content: center; font: 700 36px/1 var(--font-mono);
  color: #111; pointer-events: none; transition: color .12s;
}
.vn-arrow.sm { font-size: 24px; }
.vn-arrow.lit { color: var(--lit-strong); }
.vn-btn {
  border: 1px solid var(--sheet-line); background: #f1f3f5; color: var(--sheet-ink); border-radius: 3px;
  font: 12px var(--font-ui); cursor: pointer; padding: 0;
}
.vn-btn:hover:not(:disabled) { background: #dfe6ec; }
.vn-btn:disabled { opacity: .5; cursor: default; }
.vn-help {
  border: 1px solid var(--sheet-line); background: #fbfcfd; color: var(--sheet-ink); resize: none;
  font: 12px/1.45 var(--font-mono); padding: 6px 8px; box-sizing: border-box; overflow: auto;
}
.vn-slider { accent-color: #14607d; margin: 0; }

/* Breadboard */
.bb-wrap { background: var(--chrome); width: 776px; max-width: none; }
.bb-canvas { display: block; width: 776px; height: 371px; touch-action: none; outline-offset: -2px; }
.bb-schem { display: block; width: 776px; height: 322px; border-top: 1px solid var(--line); }
.bb-canvas.wire { cursor: crosshair; }
.bb-canvas.place { cursor: copy; }

/* Oszilloskop: der Bildschirm bleibt in beiden Themes dunkel, wie bei einem Gerät */
.sc-wrap { background: var(--chrome); width: 640px; max-width: none; }
.sc-screen { display: block; width: 640px; height: 384px; }
.sc-ctl { display: flex; gap: 6px; padding: 8px 6px; border-top: 1px solid var(--line); }
.sc-grp { border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; min-width: 0; flex: 1 1 0; }
.sc-grp h4 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.sc-grp h4.c1 { color: #b8960a; } .sc-grp h4.c2 { color: #0f97ae; }
.sc-f { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sc-sel { font: 12px var(--font-ui); color: var(--ink); background: var(--chrome-2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
.sc-btn { font: 12px var(--font-ui); color: var(--ink); background: var(--chrome-2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; flex: 1; cursor: pointer; }
.sc-btn:hover { background: var(--hover); }
.sc-pos { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 76px; accent-color: var(--accent); margin: 0; }
.sc-chbody { display: flex; gap: 6px; align-items: stretch; justify-content: space-between; }
.sc-chbody > div { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
.sc-posbox { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
/* Simulierte Boards mit Blockeditor */
.sm-wrap { background: var(--chrome); width: 1000px; max-width: none; padding: 10px; display: flex; flex-wrap: wrap; gap: 12px; box-sizing: border-box; }
.sm-left { width: 380px; display: flex; flex-direction: column; gap: 8px; }
.sm-right { flex: 1; min-width: 520px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.sm-sens { display: grid; grid-template-columns: 104px 1fr 64px; gap: 4px 8px; align-items: center; font-size: 12px; }
.sm-sens .v { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.sm-sens input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
.sm-link { font-size: 12px; color: var(--lit-strong); font-weight: 600; min-height: 16px; }
.sm-tab { font: 600 12px var(--font-ui); color: var(--ink); background: var(--chrome-2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.sm-tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sm-ed { display: flex; gap: 6px; height: 340px; }
.sm-pal { width: 168px; flex: none; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--chrome); }
.sm-pal.del { outline: 2px dashed var(--warn); }
.sm-pal .bk-in, .sm-pal .bk-sel, .sm-pal .bk-grid { pointer-events: none; }
.sm-cat { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 8px 0 2px; }
.sm-ws { flex: 1; min-width: 0; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--chrome-2); padding: 8px; }
.sm-hint { font-size: 12px; color: var(--muted); padding: 8px; }
.sm-jsv { height: 340px; } .sm-jsv .sm-js { height: 100%; resize: none; }
.sm-banner { font-size: 12px; padding: 4px 8px; border: 1px solid var(--warn); border-radius: 6px; color: var(--warn); }
.sm-conh { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sm-con { height: 64px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--chrome-2); font: 11px/1.4 var(--font-mono); padding: 4px 6px; }
.sm-con .err { color: var(--warn); }
.stack { min-height: 14px; }
.stack.root { min-height: 100%; }
.stack.focus { outline: 1px dashed var(--accent); outline-offset: 1px; }
.bk { --bc: #2b7bd6; background: var(--bc); color: #fff; border-radius: 6px; margin: 3px 0; padding: 4px 8px; font-size: 12px; cursor: grab; box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.bk.hat { border-radius: 14px 14px 6px 6px; padding-top: 6px; }
.bk-head { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.bk > .stack { margin: 4px 0 2px 12px; padding: 2px 0 2px 6px; border-left: 4px solid rgba(255,255,255,.35); min-height: 22px; }
.bk-else { margin-top: 4px; font-weight: 600; }
.bk-in { min-width: 3ch; border: 0; border-radius: 10px; padding: 1px 7px; font: 12px var(--font-mono); background: #fff; color: #111; }
.bk-sel, .bk-pick { border: 0; border-radius: 4px; font: 12px var(--font-ui); background: #fff; color: #111; padding: 1px 2px; max-width: 150px; }
.bk-pick { width: 22px; padding: 1px 0; }
.bk-x { margin-left: auto; border: 0; background: rgba(0,0,0,.28); color: #fff; width: 16px; height: 16px; border-radius: 50%; cursor: pointer; line-height: 1; font-size: 12px; padding: 0; }
.bk-grid { display: grid; grid-template-columns: repeat(5, 11px); gap: 2px; }
.bk-grid i { width: 11px; height: 11px; background: rgba(0,0,0,.35); border-radius: 2px; cursor: pointer; }
.bk-grid i.on { background: #ff5a4a; }
.bk-ins { height: 4px; border-radius: 2px; background: var(--accent); margin: 2px 0; }
/* Leiterplatte */
.pcb-wrap { background: var(--chrome); width: 940px; max-width: none; padding: 10px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
.pcb-view { overflow: auto; max-height: 560px; border: 1px solid var(--line); border-radius: 6px; background: #0f2a1f; padding: 8px; }
.pcb-view svg { display: block; }
.pcb-view .dim { opacity: .15; }
.pcb-bom { font-size: 12px; color: var(--muted); }
.pcb-tbl { border-collapse: collapse; font-size: 12px; width: 100%; }
.pcb-tbl th, .pcb-tbl td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); }
.pcb-tbl td:nth-child(2) { font-family: var(--font-mono); font-size: 11px; }
.pcb-tbl tbody tr:hover { background: var(--hover); }
.pcb-tbl .bad { color: var(--warn); font-weight: 600; }
/* micro:bit / Calliope */
.mb-wrap { background: var(--chrome); width: 540px; max-width: none; padding: 10px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
.mb-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mb-st { font-size: 12px; color: var(--muted); flex: 1; min-width: 160px; }
.mb-st.ok { color: var(--lit-strong); font-weight: 600; } .mb-st.err { color: var(--warn); }
.mb-grid { display: grid; grid-template-columns: 112px 64px 1fr; gap: 4px 8px; align-items: center; font-size: 12px; }
.mb-grid .v { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.mb-bar { height: 8px; background: var(--chrome-2); border: 1px solid var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.mb-bar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); }
.mb-bar.mid::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.mb-lamp { width: 12px; height: 12px; border-radius: 50%; background: var(--chrome-2); border: 1px solid var(--line); display: inline-block; }
.mb-lamp.on { background: #ff9068; border-color: #c4552c; }
.mb-code { width: 100%; height: 150px; box-sizing: border-box; resize: vertical; font: 11px/1.4 var(--font-mono); background: var(--chrome-2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px; }
.mb-wrap a { color: var(--accent); }
.mb-wrap details summary { cursor: pointer; font-weight: 600; font-size: 12px; }
.win-foot .c1 { color: #b8960a; font-weight: 600; } .win-foot .c2 { color: #0f97ae; font-weight: 600; }
</style>

<div id="app">
  <div class="menubar main" id="mainmenu" role="menubar"></div>
  <main id="desk" aria-label="Arbeitsfläche">
    <div id="empty" hidden><p>Keine Fenster offen. Im Menü <strong>Tools</strong> den Von Neumann Rechner, das Breadboard, das Oszilloskop oder ein simuliertes micro:bit/Calliope öffnen.</p></div>
  </main>
  <div id="tray" hidden aria-label="Minimierte Fenster"></div>
</div>

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}

try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fireTheme); } catch (e) {}

/* ---------- Menüs ---------- */
let openMenu = null;
function closeMenus() { if (openMenu) { openMenu.classList.remove('open'); openMenu = null; } }
document.addEventListener('pointerdown', e => { if (openMenu && !openMenu.contains(e.target)) closeMenus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

function buildMenu(bar, defs) {
  for (const d of defs) {
    const menu = h('div', { class: 'menu' });
    const top = h('button', { class: 'top', 'aria-haspopup': 'true', 'aria-expanded': 'false' }, d.label);
    const list = h('div', { class: 'menu-list', role: 'menu' });
    for (const it of d.items) {
      if (it.sep) { list.append(h('div', { class: 'sep' })); continue; }
      const b = h('button', { role: 'menuitem', type: 'button' });
      if (it.swatch) b.append(h('span', { class: 'swatch', style: 'background:' + it.swatch }));
      b.append(it.label);
      if (it.accel) b.append(h('span', { class: 'accel' }, it.accel));
      b.addEventListener('click', () => { closeMenus(); it.fn(); });
      list.append(b);
    }
    top.addEventListener('click', () => {
      const was = menu.classList.contains('open');
      closeMenus();
      if (!was) { menu.classList.add('open'); openMenu = menu; top.setAttribute('aria-expanded', 'true'); }
    });
    top.addEventListener('pointerenter', () => {
      if (openMenu && openMenu !== menu && bar.contains(openMenu)) { closeMenus(); menu.classList.add('open'); openMenu = menu; }
    });
    menu.append(top, list);
    bar.append(menu);
  }
}

/* ---------- Fenstersystem ---------- */
let zTop = 10, winSeq = 0;
const wins = new Set();
function updateEmpty() { emptyEl.hidden = wins.size > 0; }

function createWindow({ title, body, menus, footer, onClose }) {
  const win = h('section', { class: 'win', role: 'dialog', 'aria-label': title });
  const bMin = h('button', { class: 'wbtn', type: 'button', title: 'Minimieren', 'aria-label': 'Minimieren' }, '–');
  const bClose = h('button', { class: 'wbtn', type: 'button', title: 'Schließen', 'aria-label': 'Schließen' }, '×');
  const bar = h('div', { class: 'win-bar' }, h('span', { class: 'win-title' }, title), h('span', { class: 'win-btns' }, bMin, bClose));
  win.append(bar);
  if (menus) { const mb = h('div', { class: 'menubar inwin', role: 'menubar' }); buildMenu(mb, menus); win.append(mb); }
  win.append(h('div', { class: 'win-body' }, body));
  if (footer) win.append(footer);
  desk.append(win);
  wins.add(win);

  const n = winSeq++ % 6;
  place(16 + n * 28, 12 + n * 28);
  function place(l, t) {
    const dw = desk.clientWidth, dh = desk.clientHeight, ww = win.offsetWidth;
    const maxL = Math.max(0, dw - ww), maxT = Math.max(0, dh - 34);
    win.style.left = Math.min(Math.max(0, l), maxL) + 'px';
    win.style.top = Math.min(Math.max(0, t), maxT) + 'px';
  }
  function focus() {
    document.querySelectorAll('.win.active').forEach(w => w.classList.remove('active'));
    win.classList.add('active'); win.style.zIndex = ++zTop;
  }
  win.addEventListener('pointerdown', focus, true);
  focus();

  let drag = null;
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('.wbtn')) return;
    drag = { dx: e.clientX - win.offsetLeft, dy: e.clientY - win.offsetTop };
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => { if (drag) place(e.clientX - drag.dx, e.clientY - drag.dy); });
  const endDrag = () => { drag = null; };
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', () => place(win.offsetLeft, win.offsetTop));

  let chip = null;
  bMin.addEventListener('click', () => {
    win.hidden = true;
    chip = h('button', { type: 'button' }, title);
    chip.addEventListener('click', () => { win.hidden = false; chip.remove(); chip = null; tray.hidden = !tray.children.length; focus(); });
    tray.append(chip); tray.hidden = false;
  });
  const close = () => {
    if (onClose) onClose();
    if (chip) chip.remove();
    win.remove(); wins.delete(win);
    tray.hidden = !tray.children.length; updateEmpty();
  };
  bClose.addEventListener('click', close);
  win.closeWindow = close;
  win.moveTo = place;
  win.raise = () => {
    if (win.hidden) { win.hidden = false; if (chip) { chip.remove(); chip = null; tray.hidden = !tray.children.length; } }
    focus();
  };
  updateEmpty();
  return win;
}

/* =====================================================================
   Von-Neumann-Rechner
   ===================================================================== */
const HELP_TEXT =
`LDA <Adr> lade Akku mit Inhalt der Adresse
STA <Adr> speichert Inhalt des Akkus in Adresse
ADD <Adr> addiere Inhalt der Adresse zum Akku
SUB <Adr> subtrahiere Inhalt der Adresse vom Akku
MUL <Adr> multipliziere mit Akkumulator
DIV <Adr> dividiere Akkumulator durch Inhalt der Adr.
MOD <Adr> Akkumulator modulo Inhalt der Adresse
JMP <Adr> springe zur angegebenen Adresse
CMP <Adr> subtrahiert vom Akku den Inhalt der Adr.
JE <Adr>  springe zur Adr. wenn cmp null ergibt
JL <Adr>  springe zur Adr. wenn cmp kleiner ergibt
JG <Adr>  springe zur Adr. wenn cmp größer ergibt
IN        lade Akku mit Inhalt des I/O-Registers
OUT       schreibe Akkumulator in das I/O-Register
HLT       Halt`;

// Beispielprogramm: Fakultät von 5 (Zelle 13 = Ergebnis, 14 = n, 15 = 1, 12 = 0)
const DEMO_RAM = ['LDA 13', 'MUL 14', 'STA 13', 'LDA 14', 'SUB 15', 'STA 14', 'CMP 12', 'JG 00', 'LDA 13', 'OUT', 'HLT', '', '0', '1', '5', '1'];

class VnError extends Error {}

class VonNeumann {
  constructor() {
    this.running = false; this.timer = null; this.time = 1000;
    const stage = h('div', { class: 'vn-stage' });
    this.stage = stage;
    stage.append(h('img', { class: 'vn-bg', src: BG, alt: 'Datenbus, Adressbus und ALU' }));

    const px = (x, y, w, hh) => `left:${x}px;top:${y}px;width:${w}px;height:${hh}px`;
    const field = (label, x, y, w, hh) => {
      const i = h('input', { class: 'vn-f', type: 'text', spellcheck: 'false', autocomplete: 'off', 'aria-label': label, style: px(x, y, w, hh) });
      stage.append(i); return i;
    };
    const lab = (text, x, y, w, hh) => stage.append(h('span', { class: 'vn-lab', style: px(x, y, w, hh) }, text));
    const arrow = (ch, x, y, w, hh, sm) => {
      const a = h('span', { class: 'vn-arrow' + (sm ? ' sm' : ''), 'aria-hidden': 'true', style: px(x, y, w, hh) }, ch);
      stage.append(a); return a;
    };

    stage.append(h('textarea', { class: 'vn-help', readonly: '', 'aria-label': 'Befehlssatz', style: px(0, 0, 300, 270) }, HELP_TEXT));

    this.ram = [];
    for (let i = 0; i < 16; i++) {
      const f = field('RAM Adresse ' + String(i).padStart(2, '0'), 450, 10 + 30 * i, 80, 30);
      f.value = DEMO_RAM[i];
      f.addEventListener('input', () => {
        const s = f.selectionStart; f.value = f.value.toUpperCase(); try { f.setSelectionRange(s, s); } catch (e) {}
      });
      this.ram.push(f);
      stage.append(h('span', { class: 'vn-adr', style: px(530, 10 + 30 * i, 30, 30) }, String(i).padStart(2, '0')));
    }
    this.pc = field('Befehlszähler', 450, 520, 80, 30); this.pc.value = '0';
    this.ir = field('Befehlsregister', 450, 590, 80, 30);
    this.acc = field('Akkumulator', 80, 400, 80, 30);
    this.flag = field('Flagregister', 220, 620, 80, 30);
    this.io = field('I/O-Register', 310, 10, 80, 30);
    // Eingabe im I/O-Register treibt die Pins am Breadboard (8 Bit)
    this.io.addEventListener('input', () => {
      const t = this.io.value.trim();
      if (/^\d+$/.test(t)) { IO.latch = parseInt(t, 10) & 255; if (IO.board) IO.board.updateUI(); }
    });

    lab('Akkumulator', 170, 410, 70, 15); lab('Flagregister', 220, 600, 80, 20); lab('ALU', 170, 550, 30, 20);
    lab('I/O', 360, 50, 40, 15); lab('RAM', 570, 10, 50, 20); lab('Befehlszähler', 370, 530, 80, 15);
    lab('Befehlsregister', 370, 570, 80, 20); lab('Datenbus', 360, 310, 70, 20); lab('Adressbus', 640, 310, 60, 20);

    const A = this.arrows = {
      a11: arrow('<', 110, 599, 40, 60),   // ALU -> Akku
      a12: arrow('<', 570, 187, 30, 60),   // Adresse zum RAM
      a13: arrow('>', 290, 417, 40, 40),   // Akku -> Datenbus
      a15: arrow('<', 290, 438, 40, 60),   // Datenbus -> ALU (2. Wert)
      a16: arrow('<', 290, 328, 50, 70),   // Datenbus -> Akku
      a18: arrow('>', 370, 577, 26, 50),   // Datenbus -> Befehlsregister
      a19: arrow('>', 570, 507, 50, 50),   // Befehlszähler -> Adressbus
      a20: arrow('>', 570, 578, 50, 50),   // Befehlsregister -> Adressbus
      a21: arrow('<', 360, 187, 30, 60),   // RAM -> Datenbus
      a22: arrow('>', 400, 197, 26, 40),   // Datenbus -> RAM
	  a23: arrow('', 90, 440, 69, 47, true), // Akku -> ALU
      a24: arrow('', 461, 550, 50, 40, true) // Befehlsregister -> Befehlszähler
    };
    // Die beiden Striche von a23 einzeln: rechter Strich -2 px
    A.a23.append(h('span', {}, '\\'), h('span', { style: 'position:relative;left:-2px' }, '/'));
    // Die beiden Schrägstriche von a24 einzeln feinjustiert: links +6 px, rechts +1 px
    A.a24.append(h('span', { style: 'position:relative;left:6px' }, '/'), h('span', { style: 'position:relative;left:1px' }, '\\'));

    const btn = (text, x, y, w, hh, fn) => {
      const b = h('button', { class: 'vn-btn', type: 'button', style: px(x, y, w, hh) }, text);
      b.addEventListener('click', fn); stage.append(b); return b;
    };
    this.bStart = btn('start clock', 2, 280, 90, 23, () => this.start());
    const sliderBox = h('div', { style: px(100, 280, 120, 20) });
    this.slider = h('input', { class: 'vn-slider', type: 'range', min: '100', max: '5000', step: '100', value: '1000', 'aria-label': 'Taktzeit in Millisekunden', title: 'Taktzeit (links schnell, rechts langsam)', style: 'width:120px;height:20px' });
    this.slider.addEventListener('input', () => { this.time = +this.slider.value; this.updateClock(); });
    sliderBox.append(this.slider); stage.append(sliderBox);
    this.bStop = btn('stop', 233, 280, 70, 23, () => { this.stop(); this.say('Takt angehalten'); });
    this.bStop.disabled = true;
    btn('Befehl holen', 2, 320, 100, 23, () => this.holen());
    btn('Befehl ausführen', 102, 320, 130, 23, () => { this.exec(); });
    btn('Reset', 232, 320, 70, 23, () => this.reset());

    this.msg = h('span', { 'aria-live': 'polite' }, 'Bereit. Befehl holen, dann Befehl ausführen.');
    this.clockLab = h('span', { class: 'mono' });
    const foot = h('div', { class: 'win-foot' }, this.msg, this.clockLab);
    this.updateClock();

    vnList.add(this);
    this.win = createWindow({ title: 'Von Neumann Rechner', body: stage, footer: foot, onClose: () => { this.stop(); vnList.delete(this); } });
    // Bereits eingetragener Wert im I/O-Register liegt an den O-Pins an
    const t0 = this.io.value.trim();
    if (/^\d+$/.test(t0)) IO.latch = parseInt(t0, 10) & 255;
    if (IO.board) { IO.board.lastIn = null; IO.board.updateUI(); }
  }

  // Das Breadboard meldet den Dezimalwert der dual angelegten I-Pins
  setIO(n) {
    const t = this.io.value.trim();
    if (!(/^\d+$/.test(t) && parseInt(t, 10) === n)) this.io.value = String(n);
  }

  updateClock() { this.clockLab.textContent = 'Takt ' + this.time + ' ms je Phase'; }
  say(text, err) { this.msg.textContent = text; this.msg.className = err ? 'err' : ''; }
  lit(el, on) { el.classList.toggle('lit', on); }
  clearRam() { this.ram.forEach(r => this.lit(r, false)); }
  clearRegs() { [this.ir, this.acc, this.io, this.flag, this.pc].forEach(r => this.lit(r, false)); }
  clearArrows() { Object.values(this.arrows).forEach(a => this.lit(a, false)); }
  on(...names) { names.forEach(n => this.lit(this.arrows[n], true)); }

  counter() {
    const t = this.pc.value.trim();
    if (!/^\d+$/.test(t) || +t > 15) throw new VnError('Befehlszähler muss zwischen 0 und 15 liegen.');
    return +t;
  }
  num(el, what) {
    const t = el.value.trim();
    if (!/^-?\d+$/.test(t)) throw new VnError(what + ' enthält keine ganze Zahl: "' + t + '"');
    return parseInt(t, 10);
  }

  holen() {
    try {
      const c = this.counter();
      IO.setClk(1);   // Takt H: Befehl holen
      this.clearRegs(); this.clearRam(); this.clearArrows();
      this.lit(this.ir, true); this.on('a18', 'a21', 'a12', 'a19');
      this.ir.value = this.ram[c].value;
      this.lit(this.ram[c], true);
      this.say('Holen: Zelle ' + String(c).padStart(2, '0') + ' ins Befehlsregister.');
      return true;
    } catch (e) { return this.fail(e); }
  }

  fail(e) { this.say(e instanceof VnError ? e.message : 'Fehler: ' + e.message, true); return false; }

  // Rückgabe: 'ok' | 'halt' | 'error'
  exec() {
    try {
      IO.setClk(0);   // Takt L: Befehl ausführen
      const txt = this.ir.value.trim().toUpperCase();
      const m = txt.match(/^([A-Z]+)(?:\s*(\d{1,2}))?$/);
      if (!m) throw new VnError(txt ? 'Unbekannter Befehl: "' + txt + '"' : 'Befehlsregister ist leer. Zuerst Befehl holen.');
      const op = m[1], adr = m[2] === undefined ? null : parseInt(m[2], 10);
      const known = ['LDA', 'STA', 'ADD', 'SUB', 'MUL', 'DIV', 'MOD', 'JMP', 'CMP', 'JE', 'JL', 'JG', 'IN', 'OUT', 'HLT'];
      if (!known.includes(op)) throw new VnError('Unbekannter Befehl: "' + op + '"');
      const needsAdr = !['IN', 'OUT', 'HLT'].includes(op);
      if (needsAdr && (adr === null || adr > 15)) throw new VnError(op + ' braucht eine Adresse von 00 bis 15.');

      let count = this.counter();
      this.lit(this.ir, false);
      if (op !== 'HLT') { if (count <= 14) count++; this.pc.value = String(count); }
      this.clearRegs(); this.clearRam(); this.clearArrows();
      this.lit(this.pc, true);

      const cell = adr !== null ? this.ram[adr] : null;
      const alu = (fn, sym) => {
        const a = this.num(this.acc, 'Akkumulator'), b = this.num(cell, 'Zelle ' + String(adr).padStart(2, '0'));
        if ((op === 'DIV' || op === 'MOD') && b === 0) throw new VnError('Division durch 0 in ' + txt + '.');
        this.acc.value = String(fn(a, b));
        this.lit(this.acc, true); this.lit(cell, true);
        this.on('a21', 'a15', 'a20', 'a12', 'a11', 'a23');
        this.say(op + ': ' + a + ' ' + sym + ' ' + b + ' = ' + this.acc.value);
      };
      const jump = cond => {
        this.on('a20', 'a12', 'a24');
        if (cond) { this.pc.value = String(adr); this.say(op + ': Sprung nach ' + String(adr).padStart(2, '0')); }
        else this.say(op + ': Bedingung nicht erfüllt, weiter.');
      };
      switch (op) {
        case 'LDA': this.acc.value = cell.value; this.lit(cell, true); this.lit(this.acc, true); this.on('a16', 'a21', 'a20', 'a12'); this.say('LDA: Akku = ' + cell.value); break;
        case 'STA': cell.value = this.acc.value; this.lit(cell, true); this.lit(this.acc, true); this.on('a22', 'a13', 'a20', 'a12'); this.say('STA: Zelle ' + String(adr).padStart(2, '0') + ' = ' + this.acc.value); break;
        case 'ADD': alu((a, b) => a + b, '+'); break;
        case 'SUB': alu((a, b) => a - b, '−'); break;
        case 'MUL': alu((a, b) => a * b, '×'); break;
        case 'DIV': alu((a, b) => Math.trunc(a / b), '÷'); break;
        case 'MOD': alu((a, b) => a % b, 'mod'); break;
        case 'IN': {
          const v = IO.board ? IO.board.readInput() : null;
          if (v !== null) this.io.value = String(v);
          this.acc.value = this.io.value; this.lit(this.acc, true); this.lit(this.io, true); this.on('a16');
          this.say('IN: Akku = ' + this.io.value + (v !== null ? ' (gelesen von den Pins I0–I7)' : ''));
          break;
        }
        case 'OUT': {
          this.io.value = this.acc.value; this.lit(this.acc, true); this.lit(this.io, true); this.on('a13');
          const t = this.acc.value.trim();
          if (/^-?\d+$/.test(t)) {
            IO.latch = parseInt(t, 10) & 255;
            if (IO.board) IO.board.updateUI();
            this.say('OUT: I/O-Register = ' + this.io.value + (IO.board ? ' (an Pins O0–O7 ausgegeben, 8 Bit)' : ''));
          } else this.say('OUT: I/O-Register = ' + this.acc.value + ' (keine ganze Zahl, Pins unverändert)');
          break;
        }
        case 'JMP': jump(true); break;
        case 'CMP': {
          const a = this.num(this.acc, 'Akkumulator'), b = this.num(cell, 'Zelle ' + String(adr).padStart(2, '0'));
          this.flag.value = a < b ? 'L' : a > b ? 'G' : 'E';
          this.lit(this.flag, true); this.lit(this.acc, true); this.lit(cell, true);
          this.on('a21', 'a15', 'a20', 'a12', 'a23');
          this.say('CMP: ' + a + ' ? ' + b + ' → Flag ' + this.flag.value);
          break;
        }
        case 'JE': jump(this.flag.value.trim() === 'E'); break;
        case 'JL': jump(this.flag.value.trim() === 'L'); break;
        case 'JG': jump(this.flag.value.trim() === 'G'); break;
        case 'HLT':
          this.clearRegs(); this.clearRam(); this.clearArrows();
          this.say('HLT: Programm angehalten, der Takt läuft weiter bis „stop“.');
          return 'halt';
      }
      return 'ok';
    } catch (e) { this.fail(e); return 'error'; }
  }

  start() {
    if (this.running) return;
    this.running = true; this.bStart.disabled = true; this.bStop.disabled = false;
    const tick = () => {
      if (!this.running) return;
      this.holen();   // Der Takt läuft immer weiter, auch bei HLT oder Fehlern, bis „stop“ geklickt wird
      this.timer = setTimeout(() => {
        if (!this.running) return;
        this.exec();
        if (!this.running) return;
        this.timer = setTimeout(tick, this.time);
      }, this.time);
    };
    tick();
  }
  stop() {
    this.running = false; clearTimeout(this.timer); this.timer = null;
    this.bStart.disabled = false; this.bStop.disabled = true;
  }
  reset() {
    this.stop(); IO.setClk(0);
    this.pc.value = '0'; this.flag.value = ''; this.acc.value = ''; this.ir.value = '';
    this.clearRegs(); this.clearRam(); this.clearArrows();
    this.say('Zurückgesetzt. Befehlszähler steht auf 0.');
  }
}

/* =====================================================================
   Breadboard
   ===================================================================== */
const W = 776, H = 371, SCH_H = 322;
const WIRE_COLORS = { blue: '#2f6fe0', red: '#d63b3b', green: '#2fa84f', black: '#22262b', yellow: "#FFEE8C", orange: "#E47200"};
const WIRE_NAMES = { blue: 'Blau', red: 'Rot', green: 'Grün', black: 'Schwarz', yellow: 'Gelb', orange: "Orange" };

// Löcher: obere/untere Spalten (je 45 Spalten, 6 Zeilen) und zwei Schienen
const HOLES = [];
for (let l = 0; l < 45; l++) for (let k = 0; k < 6; k++) {
  HOLES.push({ x: 128 + 12 * l, y: 101 + 12 * k, node: l, rail: false });
  HOLES.push({ x: 128 + 12 * l, y: 198 + 12 * k, node: 45 + l, rail: false });
}
for (let l = 0; l < 46; l++) {
  HOLES.push({ x: 116 + 12 * l, y: 76, node: 90, rail: true });
  HOLES.push({ x: 116 + 12 * l, y: 283, node: 91, rail: true });
}
// I/O-Pins am linken Rand: oben 8 Schalter (S7..S0), unten 8 Ausgänge mit LED (Q7..Q0) = I/O-Register
for (let b = 0; b < 8; b++) {
  HOLES.push({ x: 62, y: 98 + 12 * b, node: 92 + b, io: 'sw', bit: b, side: 'L' });   // S0..S7: Schalter
  HOLES.push({ x: 704, y: 98 + 12 * b, node: 108 + b, io: 'o', bit: b, side: 'R' });  // O0..O7: Ausgang des Rechners (OUT)
  HOLES.push({ x: 704, y: 196 + 12 * b, node: 116 + b, io: 'i', bit: b, side: 'R' }); // I0..I7: Eingang des Rechners (IN)
}
// Linke Seite unter den Schaltern: Eingänge CH1 und CH2 des Oszilloskops, darunter der Takt des Von-Neumann-Rechners
HOLES.push({ x: 62, y: 214, node: 124, io: 'sc', bit: 0, side: 'L', name: 'CH1' });
HOLES.push({ x: 62, y: 226, node: 125, io: 'sc', bit: 1, side: 'L', name: 'CH2' });
HOLES.push({ x: 62, y: 262, node: 126, io: 'clk', bit: 0, side: 'L', name: 'CLK' });
// Unterer Rand: Pins P0..P3 und Tasten A, B von micro:bit / Calliope
[['P0', 140], ['P1', 180], ['P2', 220], ['P3', 260], ['A', 330], ['B', 370]].forEach(([name, x], k) =>
  HOLES.push({ x, y: 352, node: 127 + k, io: 'mb', bit: k, side: 'L', name }));
const IO_NAME = { sw: 'S', o: 'O', i: 'I' };
const ioName = hl => hl.name || IO_NAME[hl.io] + hl.bit;
const NODE_VCC = 90, NODE_GND = 91, NODE_COUNT = 133, NODE_MB = 127, NODE_CH1 = 124, NODE_CH2 = 125, NODE_CLK = 126;
const LAMP_L = 22, LAMP_R = 752;
const lampX = hl => hl.side === 'R' ? LAMP_R : LAMP_L;
// Gemeinsame Verbindung zwischen Von-Neumann-Rechner und Breadboard
const IO = {

}

function distSeg(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;

/* ---------- Gehäuse-Ansicht: der IC als Ganzes mit Innenleben ---------- */
const PK = { L: 80, R: 696, T: 88, H: 156, PW: 20, PH: 14 };

      else { const v = a.v ? a : b, hz = a.v ? b : a; if (hz.x1 <= v.x1 && v.x1 <= hz.x2 && v.y1 <= hz.y1 && hz.y1 <= v.y2) cost += 1; }

      let cost = 0;

  }

        { label: 'Potentiometer', fn: setPart('P') },

  // Simulation neu berechnen (Schalter, Gatter, O-Pins aus dem I/O-Register)
  compute(quiet) {

  // Wert der I-Pins für den Befehl IN; ohne laufende Simulation null

  down(e) {

  partValue(q) {

    if (!pi) return nm + (sim ? ': nicht mit +5 V/GND oder einer Quelle verbunden' : '');
    if (q.t === 'NPN' || q.t === 'PNP') return nm + ': Ic = ' + fmtI(pi.i) + ', Ib = ' + fmtI(pi.ib) + ', Vbe = ' + de(pi.vbe, 2) + ' V, Vce = ' + de(pi.vce, 2) + ' V';
    if (q.t === 'P') return nm + ': U(A–W) = ' + de(pi.v, 2) + ' V, U(W–B) = ' + de(pi.v2, 2) + ' V';
    return nm + ': U = ' + de(pi.v, 2) + ' V' + (q.t === 'C' ? '' : ', I = ' + fmtI(pi.i));

  // Bauteil-Leiste über dem Breadboard: Wert einstellen, löschen
  buildPbar() {
    const q = this.sel && this.sel.type === 'part' ? this.sel.ref : null;
    this._pbarFor = q; this._posInp = null; const pb = this.pbar; pb.textContent = '';
    if (!q) { pb.hidden = true; return; }
    pb.hidden = false;
    const apply = () => { if (this.pgh && this.pgh.t === q.t) this.pgh.val = q.val; this.updateUI(); };
    const choose = (label, opts, fmt, parse) => {
      const sl = h('select', { class: 'sc-sel', 'aria-label': label }, opts.map(v => h('option', { value: String(v) }, fmt(v))));
      if (!opts.some(v => String(v) === String(q.val))) sl.append(h('option', { value: String(q.val) }, fmt(q.val)));

    else if (q.t === 'C') { choose('Kapazität:', C_VALUES, fmtC, Number); const b = h('button', { class: 'sc-btn', type: 'button' }, 'Entladen'); b.addEventListener('click', () => { q.vc = 0; this.amem.clear(); this.updateUI(); }); pb.append(b); }
    else if (q.t === 'LED') choose('Farbe:', Object.keys(LED_COL), v => v, String);
    else if (q.t === 'Z') choose('Zenerspannung:', Z_VALUES, v => de(v, 1) + ' V', Number);
    else if (q.t === 'NPN' || q.t === 'PNP') choose('Verstärkung hFE:', HFE_VALUES, v => String(v), Number);

      const r = h('input', { type: 'range', min: 0, max: 100, step: 1, value: Math.round(q.pos * 100), 'aria-label': 'Schleiferstellung' });

  tick() {

  up() {

  updateUI() {

    let t;

    else if (this.mode === 'place') t = 'IC ' + this.ghost.typ + ': Mit der Maus über die Mittelrinne fahren und klicken.';
    else if (this.mode === 'part') { const g = this.pgh; t = PINFO[g.t].n + ': ' + (PINFO[g.t].pins === 3 ? 'Maus über eine Lochreihe, Klick setzt das Bauteil (mittlerer Anschluss = Maus).' : 'Klick auf das erste Loch, dann auf das zweite' + (g.t === 'LED' || g.t === 'D' || g.t === 'Z' ? ' (erstes Loch = Anode +, zweites = Kathode)' : '') + '.') + ' Esc beendet.'; }

  // Der gewählte IC als Ganzes mit Innenleben (Gehäuse, Pins, Gatter), Leitungen nach Pegel eingefärbt
  renderSchem() {

    text(ptxt, W - 14, 17, 'right', 12, !sim ? grey : powered ? '#1f8a3a' : '#b3261e', 600);

/* =====================================================================
   Oszilloskop: zwei Kanäle, digitale Pegel (H = 5 V, L = 0 V)
   ===================================================================== */
const SC = { W: 640, H: 384, DX: 10, DY: 8 };
const SC_COL = ['#f2d13b', '#35d0ea'];
const SC_TDIV = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000];   // ms pro Teilung
const SC_VDIV = [0.5, 1, 2, 5];
const SC_THR = [0.5, 1, 1.65, 2.5];
const de = (x, d = 2) => x.toLocaleString('de-DE', { maximumFractionDigits: d });
const fmtT = ms => ms >= 1000 ? de(ms / 1000, 3) + ' s' : de(ms, 3) + ' ms';
const fmtF = hz => hz >= 1000 ? de(hz / 1000) + ' kHz' : de(hz) + ' Hz';
const fmtR = r => r >= 1e6 ? de(r / 1e6, 2) + ' MΩ' : r >= 1e3 ? de(r / 1e3, 2) + ' kΩ' : de(r, 2) + ' Ω';
const fmtC = c => c >= 1e-6 ? de(c * 1e6, 2) + ' µF' : c >= 1e-9 ? de(c * 1e9, 2) + ' nF' : de(c * 1e12, 2) + ' pF';
const fmtI = i => { const a = Math.abs(i); return a < 1e-3 ? de(i * 1e6, 1) + ' µA' : a < 1 ? de(i * 1e3, 2) + ' mA' : de(i, 2) + ' A'; };
// Farbringe eines Widerstands (4 Ringe)
function rBands(R) {
  const col = ['#111', '#7a4a21', '#d33', '#f57c00', '#f2d13b', '#2fa84f', '#2f6fe0', '#8e44ad', '#888', '#fff'];
  let e = Math.floor(Math.log10(R)), d = Math.round(R / 10 ** (e - 1));
  if (d >= 100) { d = Math.round(d / 10); e++; }
  if (e < 1) { const t = Math.round(R * 10); return [col[Math.floor(t / 10) % 10], col[t % 10], '#c9a227', '#c9a227']; }
  return [col[Math.floor(d / 10)], col[d % 10], col[Math.min(9, e - 1)], '#c9a227'];
}

class Scope {
  constructor() {
    this.ev = [];                    // Pegeländerungen { t, v: [CH1, CH2] }; Pegel: 1, 0, -1 = offen/keine Simulation
    this.last = [-2, -2];
    this.thr = 1.65; this.tdiv = 500; this.vdiv = [2, 2]; this.pos = [4.5, 0.5]; this.on = [true, true];
    this.src = 0; this.edge = 1; this.mode = 'auto'; this.run = true; this.frozen = 0; this.hold = null;
    this.t0 = 0; this.t1 = 0; this.trigT = null; this.lastRO = 0; this.armT = 0; this.rollStart = performance.now();

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const cv = this.cv = h('canvas', { class: 'sc-screen', width: Math.round(SC.W * dpr), height: Math.round(SC.H * dpr), role: 'img', 'aria-label': 'Oszilloskop-Bildschirm' });
    this.ctx = cv.getContext('2d'); this.ctx.scale(dpr, dpr);

    const select = (opts, cur, fn) => {
      const s = h('select', { class: 'sc-sel' });
      for (const [v, l] of opts) { const o = h('option', { value: String(v) }, l); if (String(v) === String(cur)) o.selected = true; s.append(o); }
      s.addEventListener('change', () => fn(s.value)); return s;
    };
    const row = (label, el) => h('label', { class: 'sc-f' }, h('span', {}, label), el);
    const chGroup = i => {
      const cb = h('input', { type: 'checkbox' }); cb.checked = true;
      cb.addEventListener('change', () => { this.on[i] = cb.checked; });
      const pos = h('input', { type: 'range', class: 'sc-pos', min: '0', max: '8', step: '0.25', value: String(this.pos[i]), 'aria-label': 'Position CH' + (i + 1) });
      pos.addEventListener('input', () => { this.pos[i] = +pos.value; });
      return h('div', { class: 'sc-grp' }, h('h4', { class: 'c' + (i + 1) }, 'CH' + (i + 1)),
        h('div', { class: 'sc-chbody' },
          h('div', {}, row('Ein', cb), row('V/DIV', select(SC_VDIV.map(v => [v, v + ' V']), this.vdiv[i], v => { this.vdiv[i] = +v; }))),
          h('div', { class: 'sc-posbox' }, h('span', {}, 'Pos.'), pos)));
    };
    this.bRun = h('button', { class: 'sc-btn', type: 'button' }, 'Stop');
    this.bRun.addEventListener('click', () => {
      this.run = !this.run;
      if (this.run) this.arm();
      if (!this.run) this.frozen = performance.now();
      this.bRun.textContent = this.run ? 'Stop' : 'Run';
    });
    const bClr = h('button', { class: 'sc-btn', type: 'button' }, 'Löschen');
    bClr.addEventListener('click', () => { const l = this.last; this.ev = [{ t: performance.now(), v: l.slice() }]; this.hold = null; this.rollStart = performance.now(); });
    const ctl = h('div', { class: 'sc-ctl' },
      h('div', { class: 'sc-grp' }, h('h4', {}, 'Zeitbasis'),
        row('Zeit/DIV', select(SC_TDIV.map(v => [v, fmtT(v)]), this.tdiv, v => { this.tdiv = +v; this.rollStart = performance.now(); })),
        h('div', { class: 'sc-f' }, this.bRun, bClr)),
      h('div', { class: 'sc-grp' }, h('h4', {}, 'Trigger'),
        row('Quelle', select([[0, 'CH1'], [1, 'CH2']], 0, v => { this.src = +v; this.hold = null; })),
        row('Flanke', select([[1, 'steigend'], [0, 'fallend']], 1, v => { this.edge = +v; this.hold = null; })),
        row('Schwelle', select(SC_THR.map(v => [v, de(v) + ' V']), this.thr, v => { this.thr = +v; this.hold = null; })),
        row('Modus', select([['auto', 'Auto'], ['normal', 'Normal'], ['single', 'Einzel'], ['roll', 'Rollen']], 'auto', v => { this.mode = v; this.hold = null; this.arm(); }))),
      chGroup(0), chGroup(1));

    this.ro = [h('span', { class: 'c1' }), h('span', { class: 'c2' })];
    const foot = h('div', { class: 'win-foot' }, this.ro[0], this.ro[1]);

    this.win = createWindow({ title: 'Oszilloskop', body: h('div', { class: 'sc-wrap' }, cv, ctl), footer: foot,
      onClose: () => { scopes.delete(this); cancelAnimationFrame(this.raf); } });
    scopes.add(this);
    this.feed(IO.board ? IO.board.compute() : null);
    const loop = () => { this.draw(); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }

  // Einzelmodus scharf schalten: nur Flanken nach diesem Zeitpunkt zählen
  arm() { this.armT = this.rollStart = performance.now(); this.hold = null; if (this.mode === 'single' && !this.run) { this.run = true; this.bRun.textContent = 'Stop'; } }

  // Wird bei jeder Neuberechnung des Breadboards aufgerufen
  feed(sim) {
    const lv = n => (!sim || sim.short) ? -1 : sim.volts(n);
    const v = [lv(NODE_CH1), lv(NODE_CH2)];
    if (v[0] === this.last[0] && v[1] === this.last[1]) return;
    this.last = v;
    const t = performance.now();
    this.ev.push({ t, v });
    const cut = t - 130000;                                  // länger als 5 s/DIV x 10 DIV plus Reserve
    while (this.ev.length > 2 && this.ev[1].t < cut) this.ev.shift();
    if (this.ev.length > 5000) this.ev.splice(0, this.ev.length - 5000);
  }

  // Zeitfenster der Darstellung bestimmen (Rollen oder getriggert)
  frame(now) {
    const span = this.tdiv * SC.DX;
    this.trigT = null; this.sweeping = false;
    if (this.mode === 'roll') {
      // Zuerst schreibt der Strahl von links nach rechts; ist die Anzeige voll, rollt das Signal nach links
      if (now - this.rollStart < span) { this.t0 = this.rollStart; this.t1 = this.rollStart + span; this.sweeping = true; }
      else { this.t0 = now - span; this.t1 = now; }
      return;
    }
    if (this.mode !== 'roll') {
      let best = null, latest = null;
      for (let i = 1; i < this.ev.length; i++) {
        const a = this.ev[i - 1].v[this.src], b = this.ev[i].v[this.src], t = this.ev[i].t;
        if (t > now) break;
        if (this.mode === 'single' && t <= this.armT) continue;
        if (this.edge ? this.rise(a, b) : this.fall(a, b)) { latest = t; if (t + span * 0.9 <= now) best = t; }
      }
      const f = best !== null ? best : latest;
      if (f !== null) this.hold = f;
      const use = f !== null ? f : (this.mode !== 'auto' ? this.hold : null);
      if (use !== null) { this.trigT = use; this.t0 = use - span * 0.1; this.t1 = this.t0 + span; return; }
      if (this.mode !== 'auto') { this.t0 = now - span; this.t1 = now; this.waiting = true; return; }
    }
    this.t0 = now - span; this.t1 = now;
  }

  rise(a, b) { return a >= 0 && b >= 0 && a < this.thr && b >= this.thr; }
  fall(a, b) { return a >= 0 && b >= 0 && a >= this.thr && b < this.thr; }
  levelAt(i, t) { let l = -2; for (const e of this.ev) { if (e.t > t) break; l = e.v[i]; } return l; }

  draw() {
    const c = this.ctx, now = this.run ? performance.now() : this.frozen, W = SC.W, H = SC.H, dx = W / SC.DX, dy = H / SC.DY;
    this.waiting = false;
    this.frame(now);
    // Einzelmodus: nach vollständiger Aufnahme anhalten
    if (this.mode === 'single' && this.run && this.trigT !== null && this.trigT + (this.t1 - this.t0) * 0.9 <= now) {
      this.run = false; this.frozen = now; this.bRun.textContent = 'Run';
    }
    const span = this.t1 - this.t0, X = t => (t - this.t0) / span * W;
    // Hintergrund und Raster
    c.fillStyle = '#0a110e'; c.fillRect(0, 0, W, H);
    c.lineWidth = 1; c.strokeStyle = '#1d3328'; c.beginPath();
    for (let i = 1; i < SC.DX; i++) { c.moveTo(Math.round(i * dx) + .5, 0); c.lineTo(Math.round(i * dx) + .5, H); }
    for (let j = 1; j < SC.DY; j++) { c.moveTo(0, Math.round(j * dy) + .5); c.lineTo(W, Math.round(j * dy) + .5); }
    c.stroke();
    c.strokeStyle = '#2f5a45'; c.beginPath();
    c.moveTo(Math.round(W / 2) + .5, 0); c.lineTo(Math.round(W / 2) + .5, H); c.moveTo(0, Math.round(H / 2) + .5); c.lineTo(W, Math.round(H / 2) + .5);
    for (let i = 0; i < SC.DX * 5; i++) { const x = Math.round(i * dx / 5) + .5, y0 = Math.round(H / 2); c.moveTo(x, y0 - 3); c.lineTo(x, y0 + 3); }
    for (let j = 0; j < SC.DY * 5; j++) { const y = Math.round(j * dy / 5) + .5, x0 = Math.round(W / 2); c.moveTo(x0 - 3, y); c.lineTo(x0 + 3, y); }
    c.stroke();
    c.strokeStyle = '#2f5a45'; c.strokeRect(.5, .5, W - 1, H - 1);

    // Kanäle
    for (let i = 0; i < 2; i++) {
      if (!this.on[i]) continue;
      const gy = H - this.pos[i] * dy;
      const yOf = v => gy - v / this.vdiv[i] * dy;
      // Segmente [von, bis, Pegel] im sichtbaren Fenster
      const segs = []; let lvl = -2, tc = this.t0, k = 0;
      while (k < this.ev.length && this.ev[k].t <= this.t0) { lvl = this.ev[k].v[i]; k++; }
      const tend = Math.min(this.t1, now);
      for (; k < this.ev.length && this.ev[k].t < tend; k++) { segs.push([tc, this.ev[k].t, lvl]); tc = this.ev[k].t; lvl = this.ev[k].v[i]; }
      if (tend > tc) segs.push([tc, tend, lvl]);

      c.save(); c.strokeStyle = SC_COL[i]; c.globalAlpha = .45; c.lineWidth = 1; c.setLineDash([4, 4]); c.beginPath();
      for (const s of segs) if (s[2] === -1) { c.moveTo(X(s[0]), gy + .5); c.lineTo(X(s[1]), gy + .5); }
      c.stroke(); c.restore();
      // Pegelverlauf
      c.save(); c.strokeStyle = SC_COL[i]; c.lineWidth = 2; c.lineJoin = 'miter'; c.shadowColor = SC_COL[i]; c.shadowBlur = 4; c.beginPath();
      let pen = false;
      for (const s of segs) {
        if (s[2] < 0) { pen = false; continue; }
        const y = yOf(s[2]);
        if (!pen) c.moveTo(X(s[0]), y); else c.lineTo(X(s[0]), y);
        c.lineTo(X(s[1]), y); pen = true;
      }
      c.stroke(); c.restore();
      // Masse-Marke links
      c.fillStyle = SC_COL[i]; c.beginPath(); c.moveTo(0, gy - 6); c.lineTo(9, gy); c.lineTo(0, gy + 6); c.closePath(); c.fill();
      c.fillStyle = '#0a110e'; c.font = '600 9px "IBM Plex Mono", ui-monospace, monospace'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(String(i + 1), 1.5, gy + .5);
    }
    if (this.mode === 'roll' && this.run) { c.fillStyle = '#9fc9b3'; const bx = this.sweeping ? Math.min(W - 3, X(now)) : W - 3; c.fillRect(bx, 0, 3, H); }
    // Trigger-Marke
    if (this.trigT !== null) {
      const x = X(this.trigT);
      c.fillStyle = SC_COL[this.src]; c.beginPath(); c.moveTo(x - 5, 0); c.lineTo(x + 5, 0); c.lineTo(x, 8); c.closePath(); c.fill();
    }
    // Beschriftung
    c.font = '11px "IBM Plex Mono", ui-monospace, monospace'; c.textBaseline = 'alphabetic'; c.textAlign = 'left';
    c.fillStyle = '#9fc9b3'; c.fillText(fmtT(this.tdiv) + '/DIV', 10, H - 8);
    if (this.on[0]) { c.fillStyle = SC_COL[0]; c.fillText('CH1 ' + this.vdiv[0] + ' V', 120, H - 8); }
    if (this.on[1]) { c.fillStyle = SC_COL[1]; c.fillText('CH2 ' + this.vdiv[1] + ' V', 200, H - 8); }
    c.textAlign = 'right'; c.fillStyle = '#9fc9b3';
    const st = !this.run ? (this.mode === 'single' && this.trigT !== null ? 'EINZEL' : 'STOP') : this.mode === 'single' && this.waiting ? 'BEREIT' : this.mode === 'roll' ? 'ROLL' : this.trigT !== null ? 'TRIG' : this.waiting ? 'WARTE' : 'AUTO';
    c.fillText(st, W - 10, 18);
    if (!IO.board) { c.textAlign = 'center'; c.fillStyle = '#e8b04a'; c.fillText('Breadboard öffnen und CH1/CH2 verdrahten', W / 2, 40); }
    else if (!IO.board.running) { c.textAlign = 'center'; c.fillStyle = '#e8b04a'; c.fillText('Simulation am Breadboard gestoppt', W / 2, 40); }

    if (performance.now() - this.lastRO > 250) { this.lastRO = performance.now(); this.readout(now); }
  }

  // Messwerte aus den letzten beiden steigenden Flanken
  readout(now) {
    for (let i = 0; i < 2; i++) {
      const rs = [];
      for (let k = this.ev.length - 1; k > 0 && rs.length < 2; k--) {
        if (this.ev[k].t > now) continue;
        if (this.rise(this.ev[k - 1].v[i], this.ev[k].v[i])) rs.push(this.ev[k].t);
      }
      const cur = this.last[i], lv = cur < 0 ? 'offen' : cur === 5 ? 'H' : cur === 0 ? 'L' : de(cur) + ' V';
      let txt = 'CH' + (i + 1) + ': ' + lv;
      if (rs.length === 2) {
        const T = rs[0] - rs[1]; let fall = null;
        for (let k = 1; k < this.ev.length; k++) if (this.ev[k].t > rs[1] && this.ev[k].t < rs[0] && this.fall(this.ev[k - 1].v[i], this.ev[k].v[i])) { fall = this.ev[k].t; break; }
        txt += ' · T ' + fmtT(T) + ' · f ' + fmtF(1000 / T) + (fall !== null ? ' · Tastgrad ' + de((fall - rs[1]) / T * 100, 0) + ' %' : '');
      }
      this.ro[i].textContent = txt + (i === 0 ? '   ' : '');
    }
  }
}

   ===================================================================== */
const MB_CODE = `// micro:bit / Calliope mini: Anbindung an das Breadboard-Programm (USB, 115200 Baud)
serial.setBaudRate(BaudRate.BaudRate115200)
// Hinweis micro:bit: P3 teilt sich den Anschluss mit der LED-Anzeige. Dafür ggf. led.enable(false) ergänzen.
let dpins = [DigitalPin.P0, DigitalPin.P1, DigitalPin.P2, DigitalPin.P3]
let apins = [AnalogPin.P0, AnalogPin.P1, AnalogPin.P2, AnalogPin.P3]
let isOut = [false, false, false, false]
let outv = [0, 0, 0, 0]
// Befehle vom PC: P0=1, P0=0 (Ausgang setzen), P0=I (wieder Eingang), ebenso P1 bis P3
serial.onDataReceived(serial.delimiters(Delimiters.NewLine), function () {
    let line = serial.readUntil(serial.delimiters(Delimiters.NewLine))
    let i = parseInt(line.charAt(1))
    if (line.charAt(0) == "P" && i >= 0 && i <= 3) {
        if (line.charAt(3) == "I") {
            isOut[i] = false
        } else {
            isOut[i] = true
            outv[i] = parseInt(line.charAt(3))
            pins.digitalWritePin(dpins[i], outv[i])
        }
    }
})
// Messwerte an den PC: D,x,y,z,Temperatur,Licht,A,B,P0,P1,P2,P3
basic.forever(function () {
    let p: number[] = []
    for (let i = 0; i <= 3; i++) {
        if (isOut[i]) {
            p.push(outv[i] * 1023)
        } else {
            p.push(pins.analogReadPin(apins[i]))
        }
    }
    serial.writeLine("D," + input.acceleration(Dimension.X) + "," + input.acceleration(Dimension.Y) + "," + input.acceleration(Dimension.Z) + "," + input.temperature() + "," + input.lightLevel() + "," + (input.buttonIsPressed(Button.A) ? 1 : 0) + "," + (input.buttonIsPressed(Button.B) ? 1 : 0) + "," + p[0] + "," + p[1] + "," + p[2] + "," + p[3])
    basic.pause(100)
})
`;

}

  pl.ext.forEach(q => addPad(q, 0.8));

  for (const [mx, my] of [[3, 2], [pl.W - 4, 2], [3, pl.H - 3], [pl.W - 4, pl.H - 3]]) obst.push({ x: mx * g, y: my * g, r: 2.4, net: -1 });

    if (jumper && sg.layer === 0) continue;

      const a = sg.pts[i - 1], b = sg.pts[i], n = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])) || 1;

// Nur Kupfer (schwarz auf transparent, Maße in mm): Leiterbahnen, Lötaugen, Durchkontaktierungen, Ringe der Befestigungslöcher; Bohrungen ausgespart
function pcbCopperSvg(nl, pl, rt, layer, mirror, mode, units) {

  const hole = (cx, cy, ri) => 'M' + f(cx - ri) + ' ' + f(cy) + 'a' + ri + ' ' + ri + ' 0 1 0 ' + f(2 * ri) + ' 0a' + ri + ' ' + ri + ' 0 1 0 ' + f(-2 * ri) + ' 0Z';

  else for (const r of rt.res) for (const sg of r.paths) if (sg.layer === layer && sg.pts.length > 1) o.push('<polyline stroke-width="' + (r.net.power ? .6 : .3) + '" points="' + sg.pts.map(p => f(p[0] * g) + ',' + f(p[1] * g)).join(' ') + '"/>');
  o.push('</g>');

}

    const chk = (label, key) => { const c = h('input', { type: 'checkbox' }); c.checked = this.opt[key]; c.addEventListener('change', () => { this.opt[key] = c.checked; this.show(); }); return h('label', { class: 'sc-f', style: 'gap:4px' }, c, h('span', {}, label)); };
    const zoom = h('select', { class: 'sc-sel', 'aria-label': 'Vergrößerung' }, [[4, 'klein'], [7, 'mittel'], [10, 'groß'], [14, 'sehr groß']].map(([v, l]) => h('option', { value: v }, l)));
    zoom.value = '7'; zoom.addEventListener('change', () => { this.opt.zoom = +zoom.value; this.show(); });
    const mc = h('input', { type: 'checkbox' }); mc.checked = true; mc.addEventListener('change', () => { this.mirrorBottom = mc.checked; });
    this.mirrorBottom = true;
    const mirror = h('label', { class: 'sc-f', style: 'gap:4px', title: 'Für die Belichtung von der Bestückungsseite aus gesehen' }, mc, h('span', {}, 'Unterseite spiegeln'));

    widthSel.addEventListener('change', () => { this.opt.width = widthSel.value; this.generate(); });

    this.view = h('div', { class: 'pcb-view' });
    this.list = h('div', { class: 'pcb-list' });
    const tb = h('div', { class: 'mb-row' }, h('label', { class: 'sc-f', style: 'gap:4px' }, h('span', {}, 'Platine:'), modeSel), h('label', { class: 'sc-f', style: 'gap:4px' }, h('span', {}, 'Bahnbreite:'), widthSel), btn('Layout neu erzeugen', () => this.generate()), btn('SVG herunterladen', () => this.download()), this.bCu1 = btn('Kupfer Unterseite (SVG)', () => this.copper(1)), this.bCu0 = btn('Kupfer Oberseite (SVG)', () => this.copper(0)), this.bSt1 = btn('STL Unterseite (3 mm)', () => this.stl(1)), this.bSt0 = btn('STL Oberseite (3 mm)', () => this.stl(0)), mirror, zoom, chk('Oberseite', 'top'), chk('Unterseite', 'bottom'), chk('Bestückungsdruck', 'silk'), chk('Luftlinien', 'ratsnest'));

      footer: h('div', { class: 'win-foot' }, h('span', {}, 'Zweiseitig: rot Oberseite, blau Unterseite, Kreise Durchkontaktierungen. Einseitig: nur Unterseite; Drahtbrücken (grau) liegen auf der Bestückungsseite. Lehrbeispiel, keine Fertigungsdaten.')),

  generate() {

    let rt = null;
    for (let seed = 1; seed <= 8; seed++) { const r = pcbRoute(nl, pl, seed, this.opt.mode, spread); if (!rt || r.fails < rt.fails) rt = r; if (rt.fails === 0) break; }

  show() {

    this.opt.units = this.opt.width === 'narrow' ? null : pcbWiden(nl, pl, rt, this.opt.width === 'wide' ? 1.0 : 3.0, jm0);

    const svg = this.view.firstChild;
    const hl = id => svg.querySelectorAll('[data-net]').forEach(e => e.classList.toggle('dim', id !== null && e.getAttribute('data-net') !== String(id)));
    const tracks = rt.res.reduce((s, r) => s + r.paths.length, 0), vias = rt.res.reduce((s, r) => s + r.vias.length, 0), len = rt.res.reduce((s, r) => s + r.len, 0) * g;
    this.bCu0.disabled = this.bSt0.disabled = this.opt.mode !== 'double';
    this.msg.className = 'mb-st' + (rt.fails ? ' err' : ' ok');
    const jm = this.opt.mode === 'jumper', sm = this.opt.mode === 'single';
    const jumpers = rt.res.reduce((s, r) => s + r.paths.filter(p => p.layer === 0).length, 0);
    this.msg.textContent = (rt.fails ? rt.fails + ' Verbindung(en) konnten ' + (sm ? 'einseitig ' : '') + 'nicht verlegt werden (gelbe Luftlinien)' + (sm ? ', hier hilft zweiseitig oder mit Drahtbrücken. ' : '. ') : 'Alle Verbindungen verlegt. ') +
      nl.nets.length + ' Netze · Kupfer Unterseite ' + pcbCopperPct(pl, rt, this.opt.units, 1).toFixed(0) + ' % der Fläche · ' + (jm ? jumpers + ' Drahtbrücken · ' : sm ? '' : vias + ' Vias · ') + ' Leiterbahnlänge ' + len.toFixed(0) + ' mm · Platine ' + (pl.W * g).toFixed(0) + ' × ' + (pl.H * g).toFixed(0) + ' mm' + (nl.warn.length ? ' · ' + nl.warn.length + ' Hinweis(e)' : '');
    this.msg.textContent = this.msg.textContent.replace(/ {2,}/g, ' ');
    this.list.textContent = '';
    if (nl.warn.length) this.list.append(h('div', { class: 'sm-banner' }, nl.warn.map(w => h('div', {}, w))));
    const tbl = h('table', { class: 'pcb-tbl' }, h('thead', {}, h('tr', {}, h('th', {}, 'Netz'), h('th', {}, 'Anschlüsse'), h('th', {}, 'Länge'), h('th', {}, 'Status'))));
    const body = h('tbody', {});
    rt.res.forEach(r => {
      const labels = r.net.terms.map(t => t.kind === 'ic' ? pl.ics[t.ic].ref + '.' + (pl.ics[t.ic].names ? pl.ics[t.ic].names[t.pin - 1] : t.pin) : t.name);
      const tr = h('tr', {}, h('td', {}, r.net.name), h('td', {}, labels.join('  ')), h('td', {}, (r.len * g).toFixed(0) + ' mm'), h('td', { class: r.unrouted.length ? 'bad' : '' }, r.unrouted.length ? 'offen (' + r.unrouted.length + ')' : 'verlegt'));
      tr.addEventListener('pointerenter', () => hl(r.net.id)); tr.addEventListener('pointerleave', () => hl(null));
      body.append(tr);
    });
    tbl.append(body);
    const bom = h('div', { class: 'pcb-bom' }, h('strong', {}, 'Bauteile: '), pl.ics.map(ic => ic.part ? ic.ref + ' ' + ic.label : ic.ref + ' SN' + ic.typ + ' (DIL-' + ic.n + ')').join(' · '),
      '  ·  Anschlussstifte: ', [...pl.ext.keys()].join(' '));

      this.save(r.data, layer === 1 ? 'leiterplatte-kupfer-unterseite-3mm.stl' : 'leiterplatte-kupfer-oberseite-3mm.stl', 'model/stl');
      this.msg.textContent += ' (' + r.tris.toLocaleString('de-DE') + ' Dreiecke, Raster ' + r.res.toFixed(2) + ' mm, Höhe 3 mm)';
    } catch (e) { this.msg.textContent = 'STL-Export nicht möglich: ' + e.message; }
  }
  save(svg, name, mime) {
    try {
      const a = h('a', { href: URL.createObjectURL(new Blob([svg], { type: mime || 'image/svg+xml' })), download: name });
      document.body.append(a); a.click(); a.remove();
      this.msg.textContent = name + ' wurde zum Herunterladen angeboten.';
    } catch (e) { this.msg.textContent = 'Herunterladen nicht möglich: ' + e.message; }
  }
  download() {
    if (!this.res) return;
    const { nl, pl, rt } = this.res;
    this.save(pcbSvg(nl, pl, rt, { zoom: 8, top: true, bottom: true, silk: true, ratsnest: true, mode: this.opt.mode, units: this.opt.units }), 'leiterplatte.svg');
  }
  copper(layer) {
    if (!this.res) return;
    const { nl, pl, rt } = this.res;
    this.save(pcbCopperSvg(nl, pl, rt, layer, layer === 1 && this.mirrorBottom, this.opt.mode, this.opt.units), layer === 1 ? 'leiterplatte-kupfer-unterseite.svg' : 'leiterplatte-kupfer-oberseite.svg');
  }
}
let pcbWin = null;
function openPcb() {
  if (pcbWin && wins.has(pcbWin.win)) { pcbWin.win.raise(); pcbWin.generate(); return pcbWin; }
  return pcbWin = new PcbWin();
}

/* ---------- Hauptmenü ---------- */
function openVon() { return new VonNeumann(); }
// Es gibt ein Breadboard; es ist über die I/O-Pins mit dem Rechner verbunden
function openBread() {
  if (IO.board) { IO.board.win.raise(); return IO.board; }
  return new Breadboard();
}
function openScope() {
  for (const sc of scopes) { sc.win.raise(); return sc; }
  return new Scope();
}
function beenden() { [...wins].forEach(w => w.closeWindow()); }

buildMenu(document.getElementById('mainmenu'), [
  { label: 'Datei', items: [{ label: 'Beenden', accel: 'Alt+X', fn: beenden }] },
  { label: 'Tools', items: [
	{ label: 'Breadboard (Zentrale)', fn: openBread },
    { label: 'Leiterplatte (Layout aus Breadboard)', fn: openPcb },
    { label: 'Von Neumann Rechner', fn: openVon },
    { label: 'Oszilloskop', fn: openScope },
    { label: 'micro:bit / Calliope (Verbindung)', fn: openMb },
    { label: 'micro:bit (Simulation)', fn: () => openSim('microbit') },
    { label: 'Calliope mini (Simulation)', fn: () => openSim('calliope') } ] }
]);
document.addEventListener('keydown', e => {
  if (e.altKey && (e.key === 'x' || e.key === 'X' || e.code === 'KeyX')) { e.preventDefault(); beenden(); }
});
